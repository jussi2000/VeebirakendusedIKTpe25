<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Vormid ja nupud html keeles</title>
    <script src="../js/ankeetScript.js"></script>
</head>
<body>

<h1>Sportlase ankeet</h1>
<form action="#">
    <table border="1">
        <tr>
            <td>
                <!--tekstikast-->
                <label for="nimi">Sisesta oma nimi:</label>
            </td>

            <td>
                <input type="text" id="nimi" oninput="nimiLugemine()">
            </td>
            <td>
                <div id="vastus"></div>
            </td>
        </tr>
        <tr>
            <td>
                <br><strong>Vali sugu:</strong>
            </td>
            <td>

                <!-- radionupp - aniult 1 valik on õige-->
                <input type="radio" name="sugu" id="naine" value="naine" onclick="suguValik()">
                <label for="naine">naine</label>

                <br>

                <input type="radio" name="sugu" id="mees" value="mees" onclick="suguValik()">
                <label for="mees">mees</label>

                <br>

                <input type="radio" name="sugu" id="muu" value="muu" onclick="suguValik()">
                <label for="muu">muu</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <!--checkbox - mitu valikut korraga-->
                <fieldset>
                    <legend><strong>Spordialad</strong></legend>

                    <input type="checkbox" name="spordiala" id="jooksmine" value="jooksmine" onchange="sportValik()">
                    <label for="jooksmine">jooksmine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="ujumine" value="ujumine" onchange="sportValik()">
                    <label for="ujumine">ujumine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="uisutamine" value="uisutamine" onchange="sportValik()">
                    <label for="uisutamine">uisutamine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="suusatamine" value="suusatamine" onchange="sportValik()">
                    <label for="suusatamine">suusatamine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="poks" value="poks" onchange="sportValik()">
                    <label for="poks">poks</label>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- arvud - number (min nt:0(ei treeni üldse)) -->
                <label for="tund">Mitu tundi nädalas sina treenid</label>
            </td>
            <td>
                <input type="number" min="0" max="24" step="1" value="0" id="tund">
            </td>
            <tr>
            <br>
            <td>
                <!-- rippmenüü - dropdownlist -->
                <label for="tund">Mis klubi sa külastad?</label>
            </td>
        <td>
            <select name="klubi" id="klubi" onchange="klubiValik()">
                <option value="Vali">Vali...</option> <!--Ripploend-->
                <option value="gym">GYM</option>
                <option value="myfitness">MyFitness</option>
                <option value="gym24">Gym24</option>
                <option value="kalevspa">KalevSPA</option>
            </select>
        </td>
        <td>
            <div id="vastus5"></div>
        </td>
        </tr>
        <tr>
            <td>
                <label for="varv">Mis värvi tossud?</label>
            </td>
            <td>
                <input type="color" id="varv">
            </td>
        </tr>
        <tr>
            <td>
                <label for="kuupaev">Millal oli su viimane trenn?</label>
            </td>
            <td>
                <input type="date" id="kuupaev" min="2026-01-01" max="2026-12-31" onchange="kuupaevValik()">
            </td>
            <td>
                <div id="vastus6"></div>
            </td>
        </tr>

        <tr>
            <td>
                <label for="kogemus">Mitu tundi päevas sa teed trenni?</label>
            </td>
            <td>
                <input type="range" id="kogemus" min="0" max="24" step="1" value="0" oninput="rangevalik()">
            </td>
            <td>
                <div id="vastus7"></div>
            </td>
        </tr>

        <tr>
            <td>
                <label for="email">Sisesta oma e-mail:</label>
            </td>
            <td>
                <input type="email" id="email">
            </td>
        </tr>
        <tr>
            <td>
                <label for="telefoninumber">Sisesta oma telefoninumber:</label>
            </td>
            <td>
                <input type="number" id="telefoninumber" min="0" step="1" placeholder="Enter numbers only">
            </td>
        </tr>
        <tr>
            <td>
                <label for="parool">Sisesta oma parool:</label>
            </td>
            <td>
                <input type="password" id="parool">
            </td>
        </tr>
        <tr>
            <td>
                <label for="faililisamine">Lisa oma nädalane trenni graafik:</label>
            </td>
            <td>
                <input type="file" id="faililisamine">
            </td>
        </tr>
        <tr>
            <td>
                <label for="hõivatud">Märgi millal olete hõivatud:</label>
            </td>
            <td>
                <input type="week" id="hõivatud">
            </td>
        </tr>
        <!-------------------->
        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="Puhasta()">
            </td>
            <td>
                <input type="button" value="Näita andmeid" onclick="tervitus()">
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <!-------------------->
        </table>
    <br>
</form>
</body>
</html>
