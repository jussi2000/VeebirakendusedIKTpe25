<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Saia kalkulaator</title>
    <script src="../js/saiakalkScript.js"></script>
    <script src="../js/tempKalk.js"></script>
    <script src="../js/valuutaScript.js"></script>
    <script src="../js/kytuseKalk.js"></script>
    <link rel="stylesheet" href="kalkStyle.css">
</head>
<body>
<h1>Kalkulaatorid</h1>
<section id="yld">
<section id="osa1">
    <h2>Saia kalkulaator</h2>
    <label for="kogus">Kogus:</label>
    <input type="number" id="kogus" min="1" max="10" step="1" onchange="saiaKalk()">
    <br>
    <label for="saiatyyp">Palun vali saia tüüp</label>
    <select name="saiatyyp" id="saiatyyp" onchange="saiaKalk()">
    <option value="vali">vali..</option>
    <option value="mooni">moonisai</option>
    <option value="juustu">juustusai</option>
    <option value="pontsik">pontsik</option>
    <option value="kaneeli">kaneelisai</option>
    </select>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAHPSTA9Gt437IJPqW1doY_G5JW02VzGUwvA-iwkvWSQ&s=10" alt="" id="pilt">
    <div id="vastus"></div>
</section>

<section id="osa2">
    <h2>Temperatuuri kalkulaator</h2>
    <label for="temp">Sisesta temperatuuri</label>
    <input type="number" id="temp" min="-50" max="50" step="1" value="0"> &deg;
    <br>
    <input type="radio" name="tempValik"  id="celsius" value="celsius" onchange="tempTeisendus()">
    <label for="celsius">&deg;C - Celsius</label>
    <br>
    <input type="radio" name="tempValik" id="fahrenheit" value="fahrenheit" onchange="tempTeisendus()">
    <label for="fahrenheit">&deg;F - Fahrenheit</label>
    <br>
    <div id="vastus2"></div>
    <img src="https://i.pinimg.com/474x/ae/75/2d/ae752d1632e52da70d9020348ce19bb6.jpg" alt="">
</section>
    <section id="osa3">
        <h2>Valuuta kalkulaator</h2>
        <label for="valuuta">Kirjuta kuhu teisendame</label>
        (dollar, juann, nael, kroon)
        <input type="text" id="valuuta" name="valuuta">
        <br>
        <label for="euro">Sisesta summa eurodes</label>
        <input type="number" id="euro" min="1" max="10" step="1" onchange="valuutaKalk()">

        <div id="vastus3"></div>
    </section>

    <section id="osa4">
        <h2>Kütusekalkulaator</h2>

        <label for="kytus">Vali kütuse liik:</label>
        <select id="kytus" onchange="arvutaKytus()">
            <option value="bensiin">Bensiin 95</option>
            <option value="diisel">Diisel</option>
        </select>
        <br><br>

        <label for="teekond">Sõidu pikkus (km):</label>
        <input type="number" id="teekond" min="1" value="100" onchange="arvutaKytus()">
        <br><br>

        <label for="kulu">Keskmine kulu (l/100km):</label>
        <input type="number" id="kulu" min="1" step="0.1" value="7" onchange="arvutaKytus()">
        <br><br>

        <div id="kytuseVastus"></div>
        <br>

        <img id="kytusePilt" src="" alt="Kütuse pilt" style="max-width: 200px; display: none;">
    </section>
</section>
</body>
</html>
