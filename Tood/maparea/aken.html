<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Map area kasutamine</title>
    <link rel="stylesheet" href="mapStyle.css">
</head>
<body>
<h1>Lehel on kasutatud map area käsud</h1>
<h2>palun kliki hiirega erineva alale pildil</h2>
<img src="kassmaja.png" alt="kass maja" usemap="#kassmajakaart">
<!-- kasutama mapp'i(kaart)-->
<map name="kassmajakaart">
    <!-- ring -circle coords= x, y, R-->
    <area shape="circle" coords="142,141,10" href="aken.html" alt="aken">
    <!-- ristkülik -rect coords= x, y, x1, y2-->
    <area shape="rect" coords="180,220,220,260" href="kassiuks.html" alt="Uks">
    <area shape="rect" coords="51,152,251,263" href="kassikeha.html" alt="roheline keha">
    <!-- mitu nurga polügoon - poly coords= x, y, x1, y1, x2, y2-->
    <area shape="poly" coords="166,95,195,97,175,50" href="paremkorv.html" alt="parem kõrv">
    <!-- iseseisvalt teha 3 veel-->
    <area shape="poly" coords="91,81,115,90,92,47" href="vasakkorv.html" alt="vasak kõrv">
    <area shape="circle" coords="114,109,10" href="catlefteye.html" alt="vasak silm">
    <area shape="circle" coords="172,117,10" href="catrighteye.html" alt="parem silm">
</map>
<div id="selgitus">
    <h2>Kassi suu(Aken)</h2>
    <br>
    Aken on hoone seina, katusesse või sõidukisse tehtud ava,
    mis on täidetud valgust läbilaskva materjaliga. (tavaliselt klaasiga)
    <br>
    <br>
    <img src="pexels-orlando-s-197680330-11639028.jpg" class="kassi-desainiga-maja" alt="kass maja">
</div>
<br>

</body>
</html>
