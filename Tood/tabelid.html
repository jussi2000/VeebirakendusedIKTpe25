<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid HTML-keeles</title>
    <!--ühendused - link-->
    <link rel="stylesheet" href="tabeliStyle.css">
    <link rel="stylesheet" href="lipudStyle.css">
</head>
<body>
<h1>Tabelid HTML-keeles</h1>
<h2>Kõige lihtsam tabel</h2>
    <!---Tabel------->
<table id="sinine">
    <caption>Tabel 1</caption>
    <!-- 1.rida------>
    <tr>
        <td>1</td>
        <td>2</td>
    </tr>
    <!-- 2.rida------>
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
    <!--------------->
</table>

<h2>Natuke keerulisem tabel</h2>
    <!---Tabel------->
<table id="punane">
    <caption>Tabel 2</caption>
    <!-- 1.rida------>
    <tr>
        <td colspan="2">1</td>
    </tr>

    <!-- 2.rida------>
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
    <!--------------->
</table>

<h2>Veel üks natuke keerulisem tabel</h2>
<!---Tabel------->
<table id="roheline">
    <caption>Tabel 3</caption>
    <!-- 1.rida------>
    <tr>
        <td rowspan="2">1</td><!--vertikaalne-->
        <td>2</td>
    </tr>
    <!-- 2.rida------>
    <tr>
        <td>4</td>
    </tr>
    <!--------------->
</table>

<h2>Veel natuke keerulisem tabel</h2>
<table id="lilla">
    <caption>Tabel 4</caption>
    <!-- 1.rida------>
    <tr>
        <td rowspan="4">A</td><!--vertikaalne-->
        <td colspan="3">B</td><!--horisnotaalne-->
    </tr>
    <!-- 2.rida------>
    <tr>
        <td colspan="2">C</td><!--horisnotaalne-->
        <td>D</td>
    </tr>
    <!-- 3.rida------>
    <tr>
        <td>E</td><!--horisnotaalne-->
        <td>F</td><!--horisnotaalne-->
        <td rowspan="2">J</td><!--vertikaalne-->
    </tr>
    <!-- 4.rida------>
    <tr>
        <td>G</td><!--horisnotaalne-->
        <td>I</td><!--horisnotaalne-->
    </tr>
    <!--------------->
</table>
