<!DOCTYPE html><!--deklaratsioon et kasutame html5-->
<!--kommentaar-->
<html lang="et">
<head> <!--tehniline info-->
    <meta charset="UTF-8">
    <title>Johanna veebirakenduate aluste tööd</title>
    <link rel="stylesheet" href="style.css">
    <script src="tood/js/kuupaevaFunktsioonid.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"
            integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI="
            crossorigin="anonymous"></script>

    <script>
        $(document).ready(function () {
            //paremale nupu vajutamine
            $('#paremale').click(function () {
                $('#osa1').animate({left: '200px'}, 1000);
                $(this).hide();
                $('#vasakule').show();
            });

            //vasakule nupu vajutamine
            $('#vasakule').click(function () {
                $('#osa1').animate({left: '0px'}, 1000);
                $(this).hide();
                $('#paremale').show();
            });
        });

        //värvib teksti punaseks
        function tekstPunaseks(){
            $('#osa1').css('color', 'red');
        }
        function tekstMustaks(){
            $('#osa1').css('color', 'black');
        }
        function koordLugemine(event, ui){
            let koht=ui.offset;
            $('#kordinaadid').html('x: '+koht.left + ' || y: '+koht.top);
        }

        function leheStart(){
            $('#osa1').mouseenter(tekstPunaseks);
            $('#osa1').mouseleave(tekstMustaks);
            $('#osa1').draggable();
            $('#osa1').bind('drag', koordLugemine); //kordinaatide lugemine
            $('#pilt').draggable();
            $('#pilt').bind('drag', koordLugemine);

        }

    </script>

</head>
<body>
